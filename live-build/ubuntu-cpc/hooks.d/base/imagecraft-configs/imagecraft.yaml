name: ubuntu-minimal
version: "0.1"
base: bare
build-base: devel
summary: Minimal Ubuntu image for CPC
description: A minimal Ubuntu image to be built using livecd-rootfs by CPC

platforms:
  amd64:

volumes:
  pc:
    schema: gpt
    structure:
      # 1. BIOS Boot
      - name: bios-boot
        type: 21686148-6449-6E6F-744E-656564454649
        role: system-boot
        filesystem: vfat
        size: 4M
        partition-number: 14
      # 2. EFI System Partition
      - name: efi
        type: C12A7328-F81F-11D2-BA4B-00A0C93EC93B
        filesystem: vfat
        filesystem-label: UEFI
        role: system-boot
        size: 106M
        partition-number: 15
      # 3. Linux Extended Boot
      - name: boot
        type: BC13C2FF-59E6-4262-A352-B275FD6F7172
        filesystem: ext4
        filesystem-label: BOOT
        role: system-data
        size: 1G
        partition-number: 13
      # 4. Root Filesystem
      - name: rootfs
        type: 4F68BCE3-E8CD-4DB1-96E7-FBCAF984B709
        filesystem: ext4
        filesystem-label: cloudimg-rootfs
        role: system-data
        size: 3G
        partition-number: 1

filesystems:
  default:
    - mount: "/"
      device: "(volume/pc/rootfs)"
    - mount: "/boot"
      device: "(volume/pc/boot)"
    - mount: "/boot/efi"
      device: "(volume/pc/efi)"

parts:
  rootfs:
    plugin: nil
    build-packages: ["mmdebstrap"]
    override-build: |
      mmdebstrap --arch $CRAFT_ARCH_BUILD_FOR \
        --mode=sudo \
        --format=dir \
        --variant=minbase \
        --include=apt \
        --dpkgopt='path-exclude=/usr/share/man/*' \
        --dpkgopt='path-exclude=/usr/share/locale/*/LC_MESSAGES/*.mo' \
        --dpkgopt='path-exclude=/usr/share/doc/*' \
        --dpkgopt='path-include=/usr/share/doc/*/copyright' \
        --dpkgopt='path-include=/usr/share/doc/*/changelog.*' \
        $LB_DISTRIBUTION \
        $CRAFT_PART_INSTALL/ \
        $LB_PARENT_MIRROR_BINARY

      cat > $CRAFT_PART_INSTALL/etc/apt/sources.list << EOF
      # Ubuntu sources have moved to the /etc/apt/sources.list.d/ubuntu.sources
      # file, which uses the deb822 format. Use deb822-formatted .sources files
      # to manage package sources in the /etc/apt/sources.list.d/ directory.
      # See the sources.list(5) manual page for details.
      EOF

      mkdir -p $CRAFT_PART_INSTALL/etc/apt/sources.list.d
      cat > $CRAFT_PART_INSTALL/etc/apt/sources.list.d/ubuntu.sources << EOF
      Types: deb
      URIs: $LB_PARENT_MIRROR_BINARY
      Suites: $LB_DISTRIBUTION $LB_DISTRIBUTION-updates $LB_DISTRIBUTION-backports
      Components: main
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

      Types: deb
      URIs: $LB_PARENT_MIRROR_BINARY_SECURITY
      Suites: $LB_DISTRIBUTION-security
      Components: main
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
      EOF

      rm -r $CRAFT_PART_INSTALL/dev/*
      mkdir $CRAFT_PART_INSTALL/boot/efi

    organize:
      '*': (overlay)/

  packages:
    plugin: nil
    build-environment:
      - DEBIAN_FRONTEND: noninteractive
    overlay-packages:
      - grub2-common
      - grub-pc
      - shim-signed
      - linux-image-virtual
      - ubuntu-cloud-minimal
      - bsdutils
      - login
      - fuse3
    overlay-script: |
      # Populate dpkg's available database.
      chroot $CRAFT_OVERLAY sh -ec 'apt-cache dumpavail | dpkg --merge-avail'
      # Drop transient runtime state created by package installation.
      chroot $CRAFT_OVERLAY rm -rf /run/* /var/run/*
      chroot $CRAFT_OVERLAY rm -f /var/lib/dpkg/statoverride-old
      # Enable systemd-networkd
      chroot $CRAFT_OVERLAY systemctl enable systemd-networkd
      chroot $CRAFT_OVERLAY systemctl enable systemd-networkd-wait-online

  fstab:
    plugin: nil
    after: [packages]
    overlay-script: |
      cat << EOF > $CRAFT_OVERLAY/etc/fstab
      LABEL=cloudimg-rootfs  /          ext4    discard,commit=30,errors=remount-ro  0  1
      LABEL=BOOT             /boot      ext4    defaults                             0  2
      LABEL=UEFI             /boot/efi  vfat    umask=0077                           0  1
      EOF

  cloud-init:
    plugin: dump
    source: cloud-init/
    permissions:
      - path: etc/update-motd.d/60-unminimize
        mode: "755"
      - path: usr/bin/man
        mode: "755"
